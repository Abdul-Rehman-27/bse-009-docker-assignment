name: Method 2 - Build Using GitHub Actions

on:
  workflow_dispatch:

jobs:
  build-using-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (load locally for verification)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bse-009-usingworkflow:latest

      - name: Verify image is built
        run: |
          docker images
          docker image inspect bse-009-usingworkflow:latest --format 'Image ID: {{.Id}} | Size: {{.Size}} bytes'

      - name: Push image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/bse-009-usingworkflow:latest