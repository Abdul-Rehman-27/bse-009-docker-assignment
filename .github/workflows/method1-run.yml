name: Method 1 - Build Using Run Commands

on:
  workflow_dispatch:

jobs:
  build-using-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (run command)
        run: docker build -t bse-009-usingrun:latest .

      - name: Verify image is built
        run: |
          docker images
          docker image inspect bse-009-usingrun:latest --format 'Image ID: {{.Id}} | Size: {{.Size}} bytes'

      - name: Login to Docker Hub (run command)
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Tag and push image (run command)
        run: |
          docker tag bse-009-usingrun:latest ${{ secrets.DOCKERHUB_USERNAME }}/bse-009-usingrun:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/bse-009-usingrun:latest